name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type and Svelte check
        run: pnpm check

      - name: Formatting
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
      - name: Canon budget
        run: pnpm canon
      - name: Build
        run: pnpm build
